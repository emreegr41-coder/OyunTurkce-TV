name: Build OyunTurkce APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o oyuntürkçe.zip -d extracted
          find extracted -maxdepth 3 -type f | head -100

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OyunTurkce-APK
          path: extracted/**/build/outputs/apk/debug/*.apk

name: Build OyunTurkce APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP dosyası depo ana dizininde bulunamadı."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP içindeki dosyalar:"
          find extracted -maxdepth 4 -type f | head -200

      - name: Locate Android Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            BUILD_FILE=$(find extracted -maxdepth 4 -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -print -quit)

            if [ -z "$BUILD_FILE" ]; then
              echo "::error::ZIP içinde Android Gradle proje dosyası bulunamadı."
              echo "Bu ZIP bir web projesi olabilir; Android uygulama projesine dönüştürülmesi gerekebilir."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD_FILE")
          fi

          echo "Proje klasörü: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
- name: Create missing launcher icons
        shell: bash
        run: |
          RES="extracted/android/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$DENSITY"

            cat > "$RES/mipmap-$DENSITY/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path android:fillColor="#1565C0"
                  android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M8,12h32v24h-32z"/>
              <path android:fillColor="#1565C0"
                  android:pathData="M12,17h24v3h-24zM12,23h18v3h-18zM12,29h20v3h-20z"/>
          </vector>
          EOF

            cp "$RES/mipmap-$DENSITY/ic_launcher.xml" \
               "$RES/mipmap-$DENSITY/ic_launcher_round.xml"
          done
      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Find generated APK
        shell: bash
        run: |
          find extracted -type f -name '*.apk' -print

          if ! find extracted -type f -path '*/build/outputs/apk/debug/*.apk' \
            | grep -q .; then
            echo "::error::Debug APK bulunamadı."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OyunTurkce-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

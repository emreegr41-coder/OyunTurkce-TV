name: OyunTurkce APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - '*.zip'
      - '**/*.zip'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depo ana dizininde ZIP dosyası bulunamadı."
            echo "OyunTurkce.zip dosyasını deponun ana dizinine yükle."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP içeriği:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts | head -1 || true)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "HATA: ZIP içinde Gradle Android projesi bulunamadı."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"

          echo "Android projesi: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "HATA: Android projesinde app klasörü bulunamadı."
            exit 1
          fi

      - name: Create missing launcher icons
        shell: bash
        run: |
          set -euo pipefail

          RES="$PROJECT_DIR/app/src/main/res"

          mkdir -p "$RES"

          for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$DENSITY"

            cat > "$RES/mipmap-$DENSITY/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M0,0h48v48h-48z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M8,12h32v24h-32z"/>
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M12,17h24v3h-24zM12,23h18v3h-18zM12,29h20v3h-20z"/>
          </vector>
          EOF

            cp "$RES/mipmap-$DENSITY/ic_launcher.xml" \
               "$RES/mipmap-$DENSITY/ic_launcher_round.xml"
          done

          echo "Eksik uygulama simgeleri oluşturuldu."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.
